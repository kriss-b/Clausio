referentiel:
  id: chimie
  version: '2026.1'
  libelle: Chimie & pharmacie — cybersécurité des procédés (NIS2, IEC 62443, Seveso)
  description: 'Cybersécurité de l''industrie chimique et pharmaceutique : sécurité des procédés et systèmes
    instrumentés de sécurité (IEC 62443/61511), articulation avec la directive Seveso, NIS2.'
  famille: secteur
  date_maj: '2026-08-05'
  sources:
  - Directive (UE) 2022/2555 (NIS2)
  - IEC 62443 & IEC 61511 (SIS)
  - Directive Seveso III (2012/18/UE)
  - 'Extrait opérationnel destiné à outiller l''instruction cybersécurité d''une candidature. Il n''est
    PAS exhaustif et ne se substitue pas à l''analyse de conformité réglementaire ni aux normes sectorielles
    applicables : à valider et compléter avec les experts du domaine, le juridique et le DPO.'
  profils_disponibles:
    socle: Socle
exigences:
- code: CHIM-1
  axe: gouvernance
  libelle: Le fournisseur relève de NIS2 et applique les mesures de gestion des risques ; articulation
    avec les obligations Seveso le cas échéant.
  profils:
  - socle
  criticite_defaut: bloquant
  source: NIS2 art. 21 ; Seveso III
  question_rag: Le fournisseur relève de NIS2 et applique les mesures de gestion des risques ; articulation
    avec les obligations Seveso le cas échéant.
  criteres_acceptation: []
- code: CHIM-2
  axe: developpement
  libelle: Les systèmes de contrôle-commande et instrumentés de sécurité (SIS) sont sécurisés (IEC 62443
    / IEC 61511).
  profils:
  - socle
  criticite_defaut: majeur
  source: IEC 62443 ; IEC 61511
  question_rag: Les systèmes de contrôle-commande et instrumentés de sécurité (SIS) sont sécurisés (IEC
    62443 / IEC 61511).
  criteres_acceptation: []
- code: CHIM-3
  axe: developpement
  libelle: Cloisonnement strict IT/OT et protection des systèmes critiques pour la sécurité (safety).
  profils:
  - socle
  criticite_defaut: bloquant
  source: IEC 62443-3-3
  question_rag: Cloisonnement strict IT/OT et protection des systèmes critiques pour la sécurité (safety).
  criteres_acceptation: []
- code: CHIM-4
  axe: controle_acces
  libelle: Accès distants et télémaintenance sécurisés (MFA, bastion, journalisation).
  profils:
  - socle
  criticite_defaut: majeur
