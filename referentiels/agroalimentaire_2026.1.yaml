referentiel:
  id: agroalimentaire
  version: '2026.1'
  libelle: Agroalimentaire — cybersécurité de la production (NIS2, IEC 62443)
  description: 'Cybersécurité du secteur de la production et distribution alimentaire (entité importante
    NIS2) : sécurité OT des lignes de production, intégrité des données de traçabilité.'
  famille: secteur
  date_maj: '2026-08-05'
  sources:
  - Directive (UE) 2022/2555 (NIS2, entité importante)
  - IEC 62443
  - ISO/IEC 27001
  - 'Extrait opérationnel destiné à outiller l''instruction cybersécurité d''une candidature. Il n''est
    PAS exhaustif et ne se substitue pas à l''analyse de conformité réglementaire ni aux normes sectorielles
    applicables : à valider et compléter avec les experts du domaine, le juridique et le DPO.'
  profils_disponibles:
    socle: Socle
exigences:
- code: AGRO-1
  axe: gouvernance
  libelle: Le fournisseur relève de NIS2 (entité importante) et applique les mesures de gestion des risques.
  profils:
  - socle
  criticite_defaut: majeur
  source: NIS2 art. 21
  question_rag: Le fournisseur relève de NIS2 (entité importante) et applique les mesures de gestion des
    risques.
  criteres_acceptation: []
- code: AGRO-2
  axe: gouvernance
