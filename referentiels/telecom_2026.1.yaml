referentiel:
  id: telecom
  version: '2026.1'
  libelle: Télécoms & infrastructures numériques (NIS2, EECC)
  description: 'Cybersécurité des opérateurs de réseaux et fournisseurs de services numériques (entité
    essentielle NIS2) : intégrité et disponibilité des réseaux (EECC art. 40-41), 5G toolbox.'
  famille: secteur
  date_maj: '2026-08-05'
  sources:
  - Directive (UE) 2022/2555 (NIS2)
  - Code des communications électroniques européen (EECC) art. 40-41
  - EU 5G Toolbox
  - Guides ANSSI/ARCEP
  - 'Extrait opérationnel destiné à outiller l''instruction cybersécurité d''une candidature. Il n''est
    PAS exhaustif et ne se substitue pas à l''analyse de conformité réglementaire ni aux normes sectorielles
    applicables : à valider et compléter avec les experts du domaine, le juridique et le DPO.'
  profils_disponibles:
    socle: Socle
exigences:
- code: TEL-1
  axe: gouvernance
  libelle: Le fournisseur relève de NIS2 et applique les mesures de gestion des risques (entité essentielle).
