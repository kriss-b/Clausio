  - socle
  criticite_defaut: bloquant
  source: NIS2 art. 21
  question_rag: Le fournisseur relève de NIS2 et applique les mesures de gestion des risques (entité essentielle).
  criteres_acceptation: []
- code: TEL-2
  axe: continuite
