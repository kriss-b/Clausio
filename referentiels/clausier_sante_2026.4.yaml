- code: O-13.21
  chapitre: '13'
  axe: intelligence_artificielle
  libelle: Gestion de la pseudonymisation  Le Titulaire doit proposer un dispositif destiné à maintenir
    les données nominatives ainsi que le traitement de pseudonymisation au sein de l’ETABLISSEMEMENT DE
    SANTE.  La gestion et la levée de la pseudonymisation doivent être pilotées par un personnel (médical)
    de L’ETABLISSEMENT DE SANTE.  Le traitement de la ré identification devra être réalisée sur les infrastructures
    de L’ETABLISSEMENT DE SANTE. Tout écart à ces règles devra faire l'objet, de la part du Titulaire,
    d'une Analyse d’Impact relative à la Protection des Données (AIPD) cadre intégrant une analyse de
    risque conforme EBIOS RM (Ebios Risk Manager). Ces éléments soumis à L’ETABLISSEMENT DE SANTE devront
    être validés par le DPO et le RSSI de L’ETABLISSEMENT DE SANTE. Le Responsable de Traitements devra
    accepter les risques résiduels.
