referentiel:
  id: clausier_sante
  version: '2026.4'
  libelle: Clausier Conformité Numérique en Santé — Club RSSI Santé / Club DPO / AFIB
  date_maj: '2026-05-07'
  sources:
  - Clausier Conformité Numérique en Santé v4 (2026) — Club RSSI Santé / Club DPO / AFIB
  - Fiche de réponse SynAApCE 2026 (auto-appréciation de conformité aux exigences)
  - Questionnaire AFIB — dispositifs médicaux connectés (chapitre 12.2)
  - Règlement (UE) 2017/745 (MDR) et Règlement (UE) 2017/746 (DIV/IVDR)
  - RGPD (UE) 2016/679 ; PGSSI-S / ANS ; guides ANSSI ; NIS2 ; CRA
  profils_disponibles:
    socle: Solution numérique de santé (hors DM connecté)
    dispositif_medical: Dispositif médical connecté — ajoute le chapitre 12.2 (questionnaire AFIB, MDR/IVDR)
    ia: Complément activé si la solution embarque de l'IA (chapitre 13)
  note_chapitre_12_2: 'Le clausier délègue le chapitre 12.2 au questionnaire AFIB : si concerné, exiger
    le questionnaire AFIB renseigné et les documentations en complément.'
  note_criticite: La criticité est une PROPOSITION par défaut (par chapitre). Le RSSI l'ajuste selon la
    PSSI de l'établissement et le contexte du marché.
exigences:
- code: O-1.1
  chapitre: '1'
  axe: gouvernance
  libelle: 'Le Titulaire désigne parmi son personnel un correspondant sécurité pour toute la durée de
    la prestation. Ce correspondant est notamment : - l’interlocuteur privilégié de l’établissement pour
    toutes les questions relatives à la sécurité de la prestation, notamment dans le cadre d’investigations
    initiées par l’établissement ou le Titulaire suite à des incidents de sécurité opérationnels ; - chargé
    du maintien et de la mise en application du PAS (Plan d''Assurance Sécurité). - joignable aux horaires
    précisés dans le contrat.  Le Titulaire doit fournir le nom et les coordonnées directes du DPO ou
    Référent à la Protection des Données à Caractère Personnel.  Tout remplacement de ces correspondants
    doit être notifié à l’établissement. De plus, une suppléance de ces correspondants doit être assurée
    pour pallier leur indisponibilité.'
  profils: &id001
  - socle
  - dispositif_medical
