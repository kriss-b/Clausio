- code: O-2.5
  chapitre: '2'
  axe: sous_traitance
  libelle: Violation de données Le titulaire alerte l’ETABLISSEMENT DE SANTE toute violation de données
    à caractère personnel dans les 24 (vingt-quatre) heures après en avoir pris connaissance de l’existence
    d’une violation de données, par mail à l’adresse DPO [at] ETABLISSEMENT DE SANTE [.fr].  Il complète
    cette alerte d’une nouvelle notification dans les 48 (quarante-huit) heures suivantes au Responsable
    de traitement. Cette notification sera composée de la description de la violation (date, heure, nature,
    les données concernées, la cause, les catégories et le nombre approximatifs de Personnes Concernées
    par la Violation, les catégories et le nombre approximatif d’enregistrements de données personnelles
    concernées), le nom et les coordonnées du DPO ou d’un autre point de contact du Prestataire auprès
    duquel des informations complémentaires peuvent être obtenues, la description des conséquences probables
    de la Violation des données personnelles, la description des mesures prises ou que le titulaire propose
    de prendre pour remédier à la Violation des données personnelles, y compris le cas échéant, les mesures
    pour en atténuer les éventuelles conséquences dommageables et toute documentation utile afin de permettre
    à l’ETABLISSEMENT DE SANTE, si nécessaire, de notifier cette violation à l’autorité de contrôle compétente.
