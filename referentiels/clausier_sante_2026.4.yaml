- code: O-2.3
  chapitre: '2'
  axe: sous_traitance
  libelle: Sous-traitance ultérieure Le Titulaire peut faire appel à un sous-traitant pour mener des activités
    de traitement spécifiques. Il communique à l’Etablissement la liste de ses sous-traitants impliqués
    dans le traitement.  Durant la relation contractuelle, il informe préalablement et par écrit à l’adresse
    du DPO de L’ETABLISSEMENT DE SANTE (DPO [at] ETABLISSEMENT DE SANTE [.fr]) de tout changement envisagé
    concernant l’ajout ou le remplacement de sous-traitants. Cette information doit indiquer clairement
    les activités de traitement sous-traitées, l’identité et les coordonnées du sous-traitant et les dates
    du contrat de sous-traitance. L’ETABLISSEMENT DE SANTE dispose d’un délai maximum de trente (30) jours
    à compter de la date de réception de cette information pour présenter ses objections. Cette sous-traitance
    ne peut être effectuée que si L’ETABLISSEMENT DE SANTE n'a pas émis d'objection pendant le délai susvisé.   Il
    appartient au Titulaire de s’assurer que le sous-traitant respecte les obligations du présent contrat/marché
    et présente les mêmes garanties suffisantes quant à la mise en œuvre de mesures techniques et organisationnelles
    appropriées de manière à ce que le traitement réponde aux exigences de la réglementation sur la protection
    des données. Si le sous-traitant ultérieur ne remplit pas ses obligations en matière de protection
    des données, le Titulaire demeure pleinement responsable devant L’ETABLISSEMENT DE SANTE et l’en informe
    sans délai.
