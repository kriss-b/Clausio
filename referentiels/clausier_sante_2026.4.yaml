    \ et la temporalité suivante :   Score CVSS\t|| Délai de mise à disposition de correctif > 4.0 et\
    \ < 7.0\t||Prochaine mise à jour mineure de l’outil > 7.0 et < 8.9\t||Sous 3 mois > 8.9\t||Sous 1\
    \ mois Les corrections dont le score CVSS est supérieur à 7 sont à la charge du titulaire.  La mise\
    \ en œuvre des actions correctives (ou de contournement) sera faite en collaboration avec l’équipe\
    \ opérationnel de l’établissement.  L’installation du ou des correctifs ne peut en aucun cas diminuer\
    \ le niveau de sécurité de la solution. L’installation du ou des correctifs ne doit pas avoir d’impact\
    \ fonctionnel pour les utilisateurs."
