- code: O-2.2
  chapitre: '2'
  axe: sous_traitance
  libelle: "Dans le cadre de ses prestations, le titulaire mettra en œuvre toutes les mesures techniques\
    \ et organisationnelles adaptées à l’état des connaissances, au contexte, aux finalités du traitement\
    \ et aux risques afin de protéger les Données et prendra toutes les précautions nécessaires pour préserver\
    \ la sécurité, la disponibilité, la confidentialité et l’intégrité de ces Données, notamment contre\
    \ la destruction accidentelle ou illicite, la perte accidentelle, l'altération, la diffusion ou l'accès\
    \ non autorisés. En particulier, les Données Personnelles ne peuvent être divulguées, transférées,\
    \ louées ni, d’une quelconque manière, cédées ou exploitées commercialement ou non par le Sous-traitant.\
    \ Le titulaire communiquera à (aux) établissement(s) du GHT HPGL concerné(s) l’ensemble des mesures\
    \ prises pour garantir la sécurité des Données.   Par ailleurs, le titulaire s’engage notamment à\
    \ : -\ttraiter les données uniquement pour la ou les seule(s) finalité(s) énoncée(s) ci-dessus et\
    \ conformément aux instructions de(s) l’établissement(s) du GHT HPGL concerné(s). Si le Titulaire\
    \ considère qu’une instruction constitue une violation du RGPD ou de toute autre disposition du droit\
    \ de l’Union ou du droit des Etats membres relative à la protection des données, il en informe immédiatement\
    \ l’ (les) établissement(s) du GHT HPGL concerné(s), -\tinformer le(s) établissement(s) du GHT HPGL\
    \ concerné(s) s’il est (sont) tenu(s) de procéder à un transfert de données vers un pays tiers ou\
    \ à une organisation internationale, en vertu du droit de l’Union ou du droit de l’Etat membre auquel\
    \ il est soumis, -\tgarantir la confidentialité des données à caractère personnel traitées dans le\
    \ cadre du présent contrat/marché, -\tveiller à ce que les personnes autorisées à traiter les données\
    \ à caractère personnel en vertu du présent contrat/marché s’engagent à respecter elle-même la confidentialité\
    \ et reçoivent la formation nécessaire en matière de protection des données à caractère personnel,\
    \ -\tprendre en compte, s’agissant de ses outils, produits, applications ou services, les principes\
    \ de protection des données dès la conception et de protection des données par défaut, -\taider le(s)\
    \ établissement(s) du GHT HPGL concerné(s) pour la réalisation d’analyses d’impact relatives à la\
    \ protection des données et pour la réalisation de la consultation préalable de l’autorité de contrôle,\
    \ -\tcommuniquer au(x) établissement(s) du GHT HPGL concerné(s) le nom et les coordonnées de son délégué\
    \ à la protection des données, s’il en a désigné un conformément à l’article 37 du RGPD, et de son\
    \ responsable de la sécurité des systèmes d’information. -               indiquer à l’ETABLISSEMENT\
    \ DE SANTE si le traitement fait l’objet d’un transfert de données hors de l’Union Européenne, le\
    \ cas échéant apporter les éléments de preuve exigés par le RGPD, notamment la signature des clauses\
    \ contractuelles types de la commission européenne concernant un transfert de données dans un pays\
    \ ne remplissant pas les garanties adéquates."
