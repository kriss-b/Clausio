- code: O-2.4
  chapitre: '2'
  axe: sous_traitance
  libelle: 'Exercices de droit Dans la mesure du possible, le Titulaire doit aider L’ETABLISSEMENT DE
    SANTE à s’acquitter de son obligation de donner suite aux demandes d’exercice des droits des personnes
    concernées : droit d’accès, de rectification, d’effacement et d’opposition, droit à la limitation
    du traitement, droit à la portabilité des données, droit de ne pas faire l’objet d’une décision individuelle
    automatisée (y compris le profilage). Si les personnes concernées venaient à exercer auprès du Titulaire
    des demandes d’exercice de leurs droits, ce dernier doit adresser ces demandes dès réception par courrier
    électronique à DPO [at] ETABLISSEMENT DE SANTE [.fr]'
