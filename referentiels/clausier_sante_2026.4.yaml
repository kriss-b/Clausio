- code: O-7.3
  chapitre: '7'
  axe: protection_systemes
  libelle: "Le Titulaire, sur base d’un schéma d’architecture de sa solution, fournit les éléments permettant\
    \ de durcir les systèmes, avec notamment : -\tListe des équipements inclus dans le fonctionnement\
    \ global de la solution (brique existante du SI de l’établissement compris), -\tListe de services\
    \ nécessaires par équipement, -\tListe des ports à ouvrir par équipement, avec matrice des flux explicite,\
    \ -\tTout autre besoin nécessaire au bon fonctionnement de la solution.  Dans le cas de logiciels\
    \ médicaux, les flux/échanges doivent être conformes aux exigences de sécurité identifiées dans le\
    \ Cadre d’Interopérabilité des SIS publié par l’ANS.   Tout ce qui n’est pas nécessaire au bon fonctionnement\
    \ de la solution doit être interdit par défaut.  Le schéma d’architecture/Document d’Architecture\
    \ Technique précisera également la sécurisation portée par l’ensemble des échanges/flux, les mécanismes\
    \ de chiffrement (algorithme utilisé, …). Tout échange d’information sensible doit être chiffré en\
    \ utilisant des moyens cryptographiques conformes aux recommandations de l’ANSSI."
