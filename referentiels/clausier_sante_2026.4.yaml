    \ déploiement des dispositifs de sécurité du Titulaire, maintien des composants à niveau en termes\
    \ de sécurité et garantie d’une administration sécurisée intégrant a minima un antivirus mis à jour\
    \ de ses définitions, un système d’exploitation supporté par l’éditeur, des composants logiciels à\
