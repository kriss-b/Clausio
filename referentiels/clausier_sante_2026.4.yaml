- code: O-2.7
  chapitre: '2'
  axe: sous_traitance
  libelle: Droit d’audit  L’ETABLISSEMENT DE SANTE pourra faire procéder, une fois par an, ou dès survenance
    d’un indice de non-conformité, à la réalisation d’un audit du Titulaire.  Cet audit conduira à l’examen
    de tout élément permettant de s’assurer de la bonne exécution des dispositions définies au présent
    contrat (dont ce document, le « clausier de conformité numérique »).  Cet audit aura lieu aux heures
    d’ouverture des bureaux du Titulaire et sous réserve d’en avoir informé le Titulaire au moins 30 (trente)
    jours ouvrés avant sa mise en œuvre, par lettre recommandée avec accusé de réception. L'audit ne devra
    pas créer de perturbations dans le fonctionnement interne du titulaire. Cet audit ne pourra porter
    que sur le respect des obligations du titulaire au regard des obligations légales et règlementaires
    applicables en matière de protection des données et du présent marché. Les frais d’audit seront à
