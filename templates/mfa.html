{% extends "base.html" %}
{% block title %}Vérification — Clausio{% endblock %}
{% block content %}
<div class="fr-grid-row fr-grid-row--center">
  <div class="fr-col-12 fr-col-md-6 fr-col-lg-5">
    <h1 class="fr-h3">Vérification en deux étapes</h1>
    <p class="fr-hint-text">Saisissez le code à 6 chiffres affiché par votre application d'authentification.</p>
    {% if erreur %}
    <div class="fr-alert fr-alert--error fr-alert--sm fr-mb-3w"><p>{{ erreur }}</p></div>
    {% endif %}
    <form method="post" action="/login/mfa">
      <div class="fr-input-group">
        <label class="fr-label" for="code">Code de vérification</label>
        <input class="fr-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9 ]*" autofocus required>
      </div>
      <button class="fr-btn fr-mt-3w" type="submit">Vérifier</button>
      <a class="fr-btn fr-btn--tertiary fr-mt-3w" href="/logout">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
